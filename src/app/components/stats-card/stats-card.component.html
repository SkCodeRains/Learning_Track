<div class="lh-card p-4 h-100">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <span class="text-muted small fw-semibold">{{ title() }}</span>
        <div class="p-2 rounded-3" [class]="bgClass()">
            <span class="material-symbols-outlined fs-5" [class]="colorClass()"
                style="font-variation-settings: 'FILL' 1">{{ icon() }}</span>
        </div>
    </div>
    <div class="d-flex align-items-baseline gap-2">
        <h2 class="fw-bold mb-0">{{ value() }}</h2>
        @if (trend()) {
        <span class="small fw-bold" [class]="colorClass()">
            <span class="material-symbols-outlined fs-6 align-middle" style="line-height: 1;">trending_up</span> {{
            trend() }}
        </span>
        }
    </div>
</div>
