<div class="lh-card overflow-hidden">
    <div class="row g-0">
        <!-- Left Side -->
        <div
            class="col-md-4 bg-light p-5 d-flex flex-column align-items-center justify-content-center text-center border-end">
            <div class="bg-white rounded-circle shadow-sm d-flex align-items-center justify-content-center text-primary mb-4 border"
                style="width: 72px; height: 72px;">
                <span class="material-symbols-outlined fs-2">add</span>
            </div>
            <h4 class="fw-bold mb-2">Add New Goal</h4>
            <p class="text-muted small mb-0 px-3">Set a new learning objective and track your progress daily.</p>
        </div>

        <!-- Right Side -->
        <div class="col-md-8 p-5">
            <form (submit)="onSubmit($event)" class="d-flex flex-column gap-4">

                <div>
                    <label class="form-label fw-bold small mb-2 text-dark">Task Title</label>
                    <input type="text"
                        class="form-control form-control-lg border-2 border-primary-subtle rounded-3 fs-6 px-4"
                        placeholder="e.g. Learn Angular 21" [value]="taskName()" (input)="updateTaskName($event)">
                </div>

                <div>
                    <label class="form-label fw-bold small mb-2 text-dark">Description (Optional)</label>
                    <textarea class="form-control border-light-subtle rounded-3 fs-6 p-3" rows="3"
                        placeholder="Enter details about your goal..." [value]="description()"
                        (input)="updateDescription($event)"></textarea>
                </div>

                <div class="d-flex justify-content-end mt-2">
                    <button type="submit"
                        class="btn btn-primary d-flex align-items-center gap-2 px-4 py-2 shadow-sm rounded-3"
                        [disabled]="!taskName().trim()">
                        <span class="material-symbols-outlined fs-5"
                            style="font-variation-settings: 'FILL' 1">send</span>
                        <span class="fw-bold">Submit Goal</span>
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>
