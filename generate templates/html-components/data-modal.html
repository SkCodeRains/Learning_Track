<!-- Data Management Modal Component -->
<div class="modal fade" id="dataModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content lh-modal-content">
            <div class="modal-header border-0 p-4 pb-0">
                <div class="d-flex align-items-center gap-3">
                    <div class="bg-primary-subtle text-lh-primary rounded-3 d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
                        <i class="bi bi-database-fill"></i>
                    </div>
                    <h5 class="modal-title fw-bold">Data Management</h5>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <div class="alert alert-warning border-0 rounded-4 d-flex gap-3 mb-4" style="background-color: #fffbeb;">
                    <i class="bi bi-exclamation-triangle-fill text-warning fs-5"></i>
                    <div>
                        <h6 class="fw-bold text-warning-emphasis mb-1">Local Storage Notice</h6>
                        <p class="small text-warning-emphasis mb-0 opacity-75">Your data is stored locally in the browser's storage. Please ensure you backup regularly to prevent data loss.</p>
                    </div>
                </div>
                
                <div class="d-grid gap-3">
                    <button class="btn btn-outline-primary border-2 fw-bold py-3 rounded-4 d-flex align-items-center justify-content-center gap-2">
                        <i class="bi bi-download"></i>
                        Export Data Backup (.json)
                    </button>
                    <button class="btn lh-btn-primary py-3 rounded-4 d-flex align-items-center justify-content-center gap-2">
                        <i class="bi bi-upload"></i>
                        Import Backup
                    </button>
                </div>
                
                <div class="text-center mt-4">
                    <a href="#" class="text-muted small text-decoration-none">
                        Learn more about how we handle your data <i class="bi bi-box-arrow-up-right ms-1"></i>
                    </a>
                </div>
            </div>
            <div class="modal-footer border-0 p-4 pt-0">
                <button type="button" class="btn btn-link text-muted text-decoration-none fw-bold" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>
