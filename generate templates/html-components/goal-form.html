<!-- Add New Goal Component -->
<div class="lh-card overflow-hidden">
    <div class="row g-0">
        <div class="col-md-4 bg-light p-5 d-flex flex-column align-items-center justify-content-center text-center border-end">
            <div class="bg-white rounded-circle shadow-sm d-flex align-items-center justify-content-center text-lh-primary mb-3 border" style="width: 64px; height: 64px;">
                <i class="bi bi-plus-circle fs-2"></i>
            </div>
            <h4 class="fw-bold">Add New Goal</h4>
            <p class="text-muted small">Set a new learning objective and track your progress daily.</p>
        </div>
        <div class="col-md-8 p-5">
            <form>
                <div class="mb-4">
                    <label class="form-label fw-bold small">Task Title</label>
                    <input type="text" class="form-control form-control-lg border-light-subtle rounded-3 fs-6" placeholder="e.g. Learn Angular 21">
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold small">Description (Optional)</label>
                    <textarea class="form-control border-light-subtle rounded-3 fs-6" rows="3" placeholder="Enter details about your goal..."></textarea>
                </div>
                <div class="d-flex justify-content-end">
                    <button type="submit" class="btn lh-btn-primary d-flex align-items-center gap-2">
                        <i class="bi bi-send-fill"></i>
                        Submit Goal
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
